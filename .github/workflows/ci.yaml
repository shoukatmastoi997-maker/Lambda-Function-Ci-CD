on: push                  # WHEN to run
jobs:                     # WHAT to run
  deploy:
    runs-on: ubuntu-latest    # fresh temporary machine, destroyed after
    permissions:
      id-token: write         # REQUIRED for OIDC - see note below
    steps:
      - uses: actions/checkout@v4     # copy repo onto the runner
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::254185428379:role/GitHubActionsLambdaDeploy
          aws-region: us-east-1
      - run: aws lambda update-function-code ...
