name: CI

on: push

jobs:
  run-my-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install pytest
        run: pip install pytest
      - name: Run pytest
        run: pytest -v
