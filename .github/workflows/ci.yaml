name: Deploy Lambda

on:
  push:
    branches: [main]
  workflow_dispatch:

# THIS BLOCK IS THE FIX FOR MOST OIDC FAILURES.
# Without id-token: write the runner cannot request a token at all, and AWS
# reports "Not authorized to perform sts:AssumeRoleWithWebIdentity" — the same
# message you get from a genuine policy mismatch.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Repeated at job level on purpose. A job-level permissions block REPLACES
    # the top-level one rather than merging with it, so if any job declares its
    # own permissions it must re-declare id-token: write.
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Prints the exact claims AWS will see. Compare `sub` against the
      # trust policy. Delete this step once the pipeline works.
      - name: Show OIDC token claims
        run: |
          RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                 "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          TOKEN=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          PAD=$(( ${#PAYLOAD} % 4 ))
          if [ $PAD -ne 0 ]; then PAYLOAD="$PAYLOAD$(printf '=%.0s' $(seq $((4-PAD)))); "; fi
          echo "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null \
            | python3 -m json.tool \
            | grep -E '"(sub|aud|repository|ref)"' || echo "could not decode"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::254185428379:role/GitHubActionsLambdaDeploy
          aws-region: us-east-1

      - name: Confirm identity
        run: aws sts get-caller-identity

      - name: Package
        run: zip function.zip lambda_function.py

      - name: Deploy
        run: |
          aws lambda update-function-code \
            --function-name hello-cicd \
            --zip-file fileb://function.zip \
            --publish
          aws lambda wait function-updated --function-name hello-cicd

      - name: Smoke test
        run: |
          aws lambda invoke --function-name hello-cicd response.json
          cat response.json
          echo ""
          if grep -q errorMessage response.json; then exit 1; fi